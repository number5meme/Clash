# 基于 KeLee 魔改自用
# Date: 2026-01-01

# 1. 基础端口设置
port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894

# 2. 允许局域网 & IPv6
allow-lan: true
ipv6: true 
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true 

# 3. 外部控制
external-controller: 127.0.0.1:9090
secret: ""
# external-ui: ui
# external-ui-url: 'https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip'

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
find-process-mode: strict
global-client-fingerprint: chrome

geox-url:
  # geoip: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat'
  # geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'
  mmdb: 'https://geodata.kelee.one/Country-Masaiki.mmdb'
  asn: 'https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb'

# 4. 代理节点
proxies:
  - name: "***"
    type: vless
    server: ***
    port: 443
    uuid: ***
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: ***
    client-fingerprint: ***
    reality-opts:
      public-key: ***
      short-id: ***

# 5. 策略组
proxy-groups:
  - name: "Global"
    type: select
    proxies:
      - "***"
      - "DIRECT"

  # 游戏平台
  - name: "Game"
    type: select
    proxies:
      - "DIRECT"
      - "Global"

  # 微软服务
  - name: "Microsoft"
    type: select
    proxies:
      - "DIRECT"
      - "Global"

# 6. DNS 设置
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.localhost"

  # 默认 DNS
  nameserver:
    - https://223.5.5.5/dns-query

  # 后备 DNS
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
 
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.twitter.com"

# 7. Tun 模式
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

# 8. 嗅探器
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"

# 9. P2P 下载直连监听
listeners:
  - name: socks5-in-1
    type: socks
    port: 10808
    listen: 0.0.0.0
    udp: true
    proxy: DIRECT

# 10. 规则集引用 (Rule Providers)
# 锚点 - 规则参数
RuleProviders: &RuleProviders {type: http, behavior: classical, interval: 86400, format: yaml, proxy: DIRECT}

rule-providers:
  LAN:
    <<: *RuleProviders
    url: 'https://kelee.one/Tool/Clash/Rule/LAN_SPLITTER.yaml'
    path: './rules/Lan.yaml'

  Direct:
    <<: *RuleProviders
    url: 'https://kelee.one/Tool/Clash/Rule/Direct.yaml'
    path: './rules/Direct.yaml'

  Proxy:
    <<: *RuleProviders
    url: 'https://kelee.one/Tool/Clash/Rule/Proxy.yaml'
    path: './rules/Proxy.yaml'

  Game:
    <<: *RuleProviders
    url: 'https://kelee.one/Tool/Clash/Rule/Game.yaml'
    path: './rules/Game.yaml'

  Steam:
    <<: *RuleProviders
    url: 'https://rule.kelee.one/Clash/Steam.yaml'
    path: './rules/Steam.yaml'

  Microsoft:
    <<: *RuleProviders
    url: 'https://rule.kelee.one/Clash/Microsoft.yaml'
    path: './rules/Microsoft.yaml'

  Google:
    <<: *RuleProviders
    url: 'https://rule.kelee.one/Clash/Google.yaml'
    path: './rules/Google.yaml'

  ESET_China:
    <<: *RuleProviders
    url: 'https://kelee.one/Tool/Clash/Rule/ESET_China.yaml'
    path: './rules/ESET_China.yaml'


# 11. 规则
rules:
  - RULE-SET, LAN, DIRECT
  - RULE-SET, Direct, DIRECT
  - RULE-SET, Game, DIRECT
  - RULE-SET, ESET_China, DIRECT

  - RULE-SET, Steam, Game
  - RULE-SET, Microsoft, Microsoft
  - RULE-SET, Google, Global
  - RULE-SET, Proxy, Global

  - GEOIP, CN, DIRECT
  - MATCH, Global
